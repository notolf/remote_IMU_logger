; =============================================================================
;  PlatformIO project — M5Stack CoreS3 Static Level Logger
; -----------------------------------------------------------------------------
;  Build:   pio run
;  Flash:   pio run -t upload
;  Monitor: pio device monitor   (115200 baud)
; =============================================================================
[platformio]
default_envs = m5stack-cores3

[env:m5stack-cores3]
; -----------------------------------------------------------------------------
; Platform / board / framework
; -----------------------------------------------------------------------------
;  The ESP32 Arduino ecosystem moves fast. This uses the official Espressif
;  PlatformIO platform, which ships the ESP32-S3 Arduino core and the
;  `m5stack-cores3` board definition. If your installed PlatformIO is older and
;  cannot find the board or fails to build the async stack against Arduino core
;  3.x, switch to the community "pioarduino" platform by replacing the line
;  below with (see README.md):
;
;    platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
;
platform  = espressif32
board     = m5stack-cores3
framework = arduino

; -----------------------------------------------------------------------------
; Serial
; -----------------------------------------------------------------------------
monitor_speed   = 115200
upload_speed    = 1500000
monitor_filters = esp32_exception_decoder, time

; -----------------------------------------------------------------------------
; Libraries
; -----------------------------------------------------------------------------
;  * M5Unified              — board/IMU(BMI270)/RTC/PMU/display/touch abstraction
;  * ArduinoJson v7         — WebSocket JSON payloads
;  * ESP32Async/AsyncTCP    — async TCP backend (maintained fork, ESP32 core 2.x & 3.x)
;  * ESP32Async/ESPAsyncWebServer — async HTTP + WebSocket server (no CDN needed)
;  SD / FS / SPI / WiFi / Preferences / time are built into the ESP32 Arduino core.
lib_deps =
    m5stack/M5Unified @ ^0.2.0
    bblanchon/ArduinoJson @ ^7.0.0
    ESP32Async/AsyncTCP @ ^3.2.0
    ESP32Async/ESPAsyncWebServer @ ^3.6.0

; -----------------------------------------------------------------------------
; Build flags
; -----------------------------------------------------------------------------
;  CoreS3 has 8 MB PSRAM (used for the full-screen display sprite).
;  USB CDC on boot routes Serial to the USB-C port.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

; -----------------------------------------------------------------------------
; Flash / partitions  (16 MB flash on the CoreS3)
; -----------------------------------------------------------------------------
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
