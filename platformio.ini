; =============================================================================
;  PlatformIO project — M5Stack CoreS3 Static Level Logger
; -----------------------------------------------------------------------------
;  Build:   pio run
;  Flash:   pio run -t upload
;  Monitor: pio device monitor   (115200 baud)
; =============================================================================
[platformio]
default_envs = m5stack-cores3

[env:m5stack-cores3]
; -----------------------------------------------------------------------------
; Platform / board / framework
; -----------------------------------------------------------------------------
;  Official Espressif PlatformIO platform, which ships the ESP32-S3 Arduino core
;  and the `m5stack-cores3` board definition. If your installed PlatformIO is
;  older and cannot find the board, switch to the community "pioarduino" platform
;  by replacing the line below with (see README.md):
;
;    platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
;
platform  = espressif32@^6.5.0
board     = m5stack-cores3
framework = arduino

; -----------------------------------------------------------------------------
; Serial
; -----------------------------------------------------------------------------
monitor_speed   = 115200
upload_speed    = 1500000
monitor_filters = esp32_exception_decoder, time

; -----------------------------------------------------------------------------
; Libraries
; -----------------------------------------------------------------------------
;  * M5Unified — board/IMU(BMI270)/RTC/PMU/display/touch abstraction
;  The phone dashboard needs NO extra libraries: WiFi / WebServer / DNSServer /
;  ESPmDNS (and SD / FS / SPI / Preferences / time) are all built into the
;  ESP32 Arduino core. The synchronous WebServer is used deliberately — no
;  ESPAsyncWebServer/AsyncTCP dependency and no cross-task state sharing.
;
;  M5GFX is a REQUIRED dependency of M5Unified (M5.Display / M5Canvas — the
;  bubble level, buttons and calibration screens are all drawn with it), so it
;  cannot be excluded.
;
;  The M5GFX zip line below works around a corrupted M5GFX download: the copy
;  in PlatformIO's GLOBAL cache (~/.platformio/.cache) was extracted with files
;  missing (lgfx/internal/memory.h, lgfx/v1/misc/DataWrapper.hpp -> "No such
;  file or directory"), and deleting the project's .pio does NOT clear that
;  cache. Fetching the release zip from GitHub bypasses the bad cache entry and
;  needs no git client. After purging ~/.platformio/.cache you may delete the
;  zip line and let M5Unified resolve M5GFX from the registry again.
lib_deps =
    m5stack/M5Unified@^0.2.2
    M5GFX=https://github.com/m5stack/M5GFX/archive/refs/tags/0.2.22.zip

; -----------------------------------------------------------------------------
; Build flags
; -----------------------------------------------------------------------------
;  CoreS3 has 8 MB PSRAM (used for the full-screen display sprite).
;  USB CDC on boot routes Serial to the USB-C port.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

; -----------------------------------------------------------------------------
; Flash / partitions  (16 MB flash on the CoreS3)
; -----------------------------------------------------------------------------
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

; -----------------------------------------------------------------------------
; On-chip debugging (the "PIO Debug" F5 configuration in VS Code)
; -----------------------------------------------------------------------------
;  The ESP32-S3 exposes USB-Serial-JTAG on the SAME USB-C connector — no
;  external probe needed. The board definition defaults to a CMSIS-DAP probe,
;  so without this F5 fails with ".pioinit: Remote communication error /
;  Target disconnected". Close the serial monitor before starting a debug
;  session (one app at a time on the port).
debug_tool = esp-builtin
debug_init_break = tbreak setup
